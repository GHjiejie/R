services:
  redis:
    image: redis:7.4-alpine
    container_name: demo-redis-patterns
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-patterns-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  redis-patterns-data:
